<h3 id="sigil_toc_id_95">要饭</h3>
<div class="dual-layout">
		余坠地于贫窭之室，懵懂而至天命之年，痴于诗文，难谋稻粱。身非汗血之骥，宜无伯乐之援，或是蓬蒿之人。箪瓢布衣虽足，不辞嗟来之食，是以要饭于此。君子以为潼溪注有可取处，何妨惠赐，余则笑纳，亦不敢称俗子之谢。有以教我者，赐邮<a href="mailto:yivifu@live.cn">yivifu@live.cn</a>。</div>
